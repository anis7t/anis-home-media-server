apiVersion: v1
kind: Service
metadata:
  name: {{ include "media-server.postgresName" . }}
  labels:
    {{- include "media-server.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
  selector:
    {{- include "media-server.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
