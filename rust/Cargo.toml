[package]
name = "media-server-api"
version = "0.1.0"
edition = "2021"
authors = ["Anis Parvez <anis@anisparvez.in>"]
description = "High-performance Rust API foundation for Anis' Home Media Server"

[dependencies]
axum = { version = "0.8", features = ["json", "multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros", "chrono", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.33"
dotenvy = "0.15"
mime_guess = "2.0"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
flate2 = "1.1.10"
# Phase C4a: DLNA. quick-xml parses UPnP device descriptions and SOAP
# responses; if-addrs enumerates interfaces for SSDP (the psutil equivalent);
# socket2 carries the multicast socket options tokio's UdpSocket cannot set.
quick-xml = "0.37"
if-addrs = "0.13"
socket2 = { version = "0.5", features = ["all"] }
# Phase C4b: the IPv4 neighbour table, so Cast discovery does not shell out to
# `arp -a` the way the Python implementation does.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
] }

[dev-dependencies]
http-body-util = "0.1"
