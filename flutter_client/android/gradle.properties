org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# The checkout lives on a USB (microSD) volume. Kotlin's incremental caches are
# memory-mapped, and closing them fails on this volume ("Could not close
# incremental caches ... cacheable/caches-jvm/jvm/kotlin"), which aborts
# assembleRelease. Verified 2026-09-27: three release builds failed identically
# (after clearing the caches, killing the Gradle daemons and a full flutter
# clean) until this was set. Builds are slower, output is identical.
kotlin.incremental=false
